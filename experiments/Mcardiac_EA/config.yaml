dataset: heart_slide_seq
data_root: data
run_root: artifacts/results
checkpoint_root: artifacts/checkpoints
scanvi_dir: artifacts/checkpoints/scanvi
lr_pairs_path: ../../lrpairs/mouse/LR_pairs.csv
spatial_dimension: 2
stage1_module: stvirtual.models.stage1_3d
stage2_module: stvirtual.models.stage2_3d_transition
latent_key: X_scanVI
celltype_source_key: cell_type
decoder_checkpoint: artifacts/checkpoints/decoder/checkpoints/{src}_{tgt}.pt
stage1_checkpoint: artifacts/checkpoints/stage1
stage2_checkpoint: artifacts/checkpoints/stage2
output_dir: artifacts/results/simulation
stage1_loss:
  uot_eps: 0.05
  uot_tau: 0.5
  uot_lam_x: 2.0
  uot_lam_f: 0.05
  lam_uot: 1.0
stage2_loss:
  rl_xy: 2.0
  rl_z: 0.5
boundary:
  dimension: 2
  alpha_factor: 3.2
  target_frac: 0.99
  expand0: 1.08
  expand_step: 0.01
  expand_max: 1.3
  fallback_expand: 1.05
  n_resample: 256
  n_cache: 256
routes:
- - E10.5_CD1
  - E12.5_CD1
input_path: artifacts/checkpoints/scanvi/adata.h5ad
transition_prior_path: transition_prior.csv
raw_data_dir: data/GSE282547
coordinate_dir: data/coordinates
preprocess_output: artifacts/preprocessing
decoder_training:
  epochs: 100
  patience: 20
  batch_size: 256
  overwrite: true
training_manifest: artifacts/training/{src}_to_{tgt}.json
